<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站点导航</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #eef2f7 0%, #dfe9f3 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .nav-card {
            display: block;
            background: #fff;
            border: 1px solid #e5e9f0;
            border-radius: 10px;
            padding: 24px;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .nav-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .nav-card .icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .nav-card h2 {
            margin: 0 0 8px;
            font-size: 18px;
            color: #007BFF;
        }

        .nav-card p {
            margin: 0;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>站点导航</h1>
        <p class="subtitle">点击进入各个小项目</p>
        <div class="nav-grid">
            <a class="nav-card" href="bing/index.html">
                <div class="icon">🔍</div>
                <h2>Bing 热搜搜索</h2>
                <p>抓取各平台热词并自动进行 Bing 搜索</p>
            </a>
            <a class="nav-card" href="binary-clock/index.html">
                <div class="icon">🕰️</div>
                <h2>二进制钟楼</h2>
                <p>Binary Clock Tower</p>
            </a>
            <a class="nav-card" href="hanzi/index.html">
                <div class="icon">✍️</div>
                <h2>小学写字练习</h2>
                <p>人教版写字表</p>
            </a>
            <a class="nav-card" href="mc-checkin/index.html">
                <div class="icon">📋</div>
                <h2>方块清单</h2>
                <p>Craft Check-in</p>
            </a>
        </div>
    </div>
</body>
</html>
